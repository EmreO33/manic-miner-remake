);
LEVEL_DEFS.forEach(d=>{
 const g=[...Array(ROWS)].map(()=>Array(COLS).fill(' '));
 const api={h(r,c0,c1,ch='='){for(let c=c0;c<=c1;c++)g[r][c]=ch},set(c,r,ch){g[r][c]=ch},v(c,r0,r1,ch='#'){for(let r=r0;r<=r1;r++)g[r][c]=ch}};

});

/* ---------- state ---------- */
let state='title',lvl=null,p=null,li=0,score=0,lives=3,air=100,fade=1,t=0,dieT=0,shake=0,stateT=0;
let hardcore=false,hiN=0,hiH=0,hi=0;try{hiN=+localStorage.getItem('mm_hi')||0;hiH=+localStorage.getItem('mm_hi_hc')||0}catch(e){}
const numLevels=()=>hardcore?LEVEL_DEFS.length:5;
let crt=true,musicOn=true,sfxOn=true,nextLife=5000;
const parts=[],motes=[];
const hasSolid=ch=>'#=c><'.includes(ch);
const pad=n=>String(n).padStart(6,'0');

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function buildBG(pal,seed){
 const c=document.createElement('canvas');c.width=CW;c.height=CAVE_H;const g=c.getContext('2d');
 const gr=g.createLinearGradient(0,0,0,CAVE_H);gr.addColorStop(0,pal.bg[0]);gr.addColorStop(1,pal.bg[1]);
 g.fillStyle=gr;g.fillRect(0,0,CW,CAVE_H);
 const r=mulberry32(seed);
 for(let i=0;i<14;i++){const x=r()*CW,w=40+r()*120,h=100+r()*260;g.fillStyle='rgba(255,255,255,0.03)';
  g.beginPath();g.moveTo(x,CAVE_H);g.lineTo(x+w/2,CAVE_H-h);g.lineTo(x+w,CAVE_H);g.fill();}
 for(let i=0;i<10;i++){const x=r()*CW,w=20+r()*50,h=40+r()*120;g.fillStyle='rgba(0,0,0,0.25)';
  g.beginPath();g.moveTo(x,0);g.lineTo(x+w/2,h);g.lineTo(x+w,0);g.fill();}
 for(let i=0;i<90;i++){g.fillStyle=`rgba(255,255,255,${0.04+r()*0.08})`;g.fillRect(r()*CW,r()*CAVE_H,2,2);}
 g.strokeStyle='rgba(255,255,255,0.03)';g.lineWidth=1;
 for(let x=0;x<=CW;x+=T){g.beginPath();g.moveTo(x,0);g.lineTo(x,CAVE_H);g.stroke();}
 for(let y=0;y<=CAVE_H;y+=T){g.beginPath();g.moveTo(0,y);g.lineTo(CW,y);g.stroke();}
 return c;
}
const STYLE_COL={critter:'#ff5fa2',robot:'#ff6a4d',bat:'#b57bff',saw:'#dfe6ff'};
function mkEnemy(d){
 if(d.t==='walk'){const w=30,h=46,xmin=d.x0*T,xmax=d.x1*T-w;
  return{t:'walk',w,h,x:xmin+(xmax-xmin)*(d.ph||0),y:d.row*T-h,xmin,xmax,dir:1,sp:d.sp*(hardcore?1.2:1),style:d.style,a:0,col:STYLE_COL[d.style]};}
 const s=30,ymin=d.r0*T,ymax=d.r1*T-s;
 return{t:'vert',w:s,h:s,x:d.col*T+1,y:ymin+(ymax-ymin)*(d.ph||0),ymin,ymax,dir:1,sp:d.sp*(hardcore?1.2:1),style:d.style,a:0,col:STYLE_COL[d.style]};
}
function loadLevel(i){
 const d=LEVEL_DEFS[i];
 lvl={idx:i,name:d.name,pal:d.pal,grid:d.grid.map(r=>r.slice()),keys:d.keys.map(k=>({c:k[0],r:k[1],got:false})),
  enemies:d.enemies.map(mkEnemy),portal:{c:d.portal[0],r:d.portal[1]},crumble:{},airSecs:d.air*(hardcore?.9:1),bg:buildBG(d.pal,i*977+13)};
 p={x:d.start.c*T+(T-PW)/2,y:d.start.floor*T-PH,vx:0,vy:0,on:true,face:1,coyote:0,jbuf:0,takeoff:d.start.floor*T,wp:0,jumped:false};
 air=100;fade=1;parts.length=0;mStep=0;mBar=0;
 motes.length=0;for(let k=0;k<40;k++)motes.push({x:Math.random()*CW,y:Math.random()*CAVE_H,s:Math.random()*.4+.1,a:Math.random()*6});
}
function startGame(hc){hardcore=!!hc;hi=hardcore?hiH:hiN;score=0;lives=hardcore?0:3;li=0;nextLife=5000;loadLevel(0);state='play';initAudio();}

/* ---------- audio ---------- */
let AC=null,master,musicG,nextNote=0,mi=0;
const MEL=[[0,1],[2,1],[3,1],[5,1],[7,1],[3,1],[7,2],[null,1],[6,1],[2,1],[6,2],[null,1],[5,1],[1,1],[5,2],[null,1],
 [0,1],[2,1],[3,1],[5,1],[7,1],[3,1],[7,2],[12,1],[10,1],[7,1],[3,1],[7,1],[10,3],[null,2]];
function initAudio(){
 if(AC)return;
 try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.5;master.connect(AC.destination);
  musicG=AC.createGain();musicG.gain.value=musicOn?1:0;musicG.connect(master);nextNote=AC.currentTime+.1;
  setInterval(musicTick,50);
 }catch(e){AC=null}
}

/* ---------- dynamic music ---------- */
const SC={min:[0,2,3,5,7,8,10],dor:[0,2,3,5,7,9,10],phr:[0,1,3,5,7,8,10],harm:[0,2,3,5,7,8,11],lyd:[0,2,4,6,7,9,11]};
const THEMES=[
 {root:-12,sc:'min',bpm:124,lead:'square',prog:[[0,5,3,6],[0,3,5,4]]},
 {root:-10,sc:'dor',bpm:136,lead:'sawtooth',prog:[[0,3,6,4],[0,5,3,4]]},
 {root:-14,sc:'phr',bpm:112,lead:'square',prog:[[0,1,0,6],[0,3,1,6]]},
 {root:-9,sc:'lyd',bpm:128,lead:'triangle',prog:[[0,4,5,3],[0,1,4,3]]},
 {root:-8,sc:'harm',bpm:146,lead:'sawtooth',prog:[[0,5,6,4],[0,3,4,5]]},
 {root:-11,sc:'min',bpm:150,lead:'triangle',prog:[[0,3,6,4],[0,5,3,6]]},
 {root:-15,sc:'phr',bpm:140,lead:'square',prog:[[0,1,6,1],[0,3,1,6]]},
 {root:-10,sc:'dor',bpm:152,lead:'sawtooth',prog:[[0,6,3,4],[0,5,4,3]]},
 {root:-13,sc:'harm',bpm:158,lead:'square',prog:[[0,1,5,4],[0,6,4,5]]},
 {root:-9,sc:'phr',bpm:166,lead:'sawtooth',prog:[[0,1,0,6],[0,5,1,6]]}
];
let mStep=0,mBar=0,mTitle=0,noiseBuf=null,curBar=null;
function degNote(sc,d){return sc[((d%7)+7)%7]+12*Math.floor(d/7)}
function hz(n){return 440*Math.pow(2,n/12)}
function drum(type,time){
 if(!AC)return;const dl=time-AC.currentTime;
 if(type==='kick'){tone(150,.14,'sine',.5,-110,dl,musicG);return;}
 if(!noiseBuf){noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
 const src=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
 src.buffer=noiseBuf;f.type='highpass';f.frequency.value=type==='hat'?7000:1800;
 const len=type==='hat'?.04:.13,vol=type==='hat'?.05:.16;
 g.gain.setValueAtTime(vol,time);g.gain.exponentialRampToValueAtTime(.001,time+len);
 src.connect(f);f.connect(g);g.connect(musicG);src.start(time);src.stop(time+len+.02);
}
function makeBar(th,bar){
 const sc=SC[th.sc],phrase=Math.floor(bar/4),pb=bar%4,prog=th.prog[phrase%2];
 const deg=prog[pb],seed=(li+1)*1000+(phrase%3)*50+(pb%2===1?7:0)+(pb===3?3:0);
 const r=mulberry32(seed),lead=Array(16).fill(null);let d=deg+2+7;
 const rhythm=[0,3,6,8,10,12,14];
 for(const st of rhythm){if(r()<.72){d+=Math.floor(r()*5)-2;d=Math.max(deg+4,Math.min(deg+11,d));lead[st]=degNote(sc,d);}}
 if(pb===3)lead[12]=degNote(sc,deg+7);
 return{deg,lead,sc,pb,phrase,drop:phrase%4===3&&pb<2};
}
function gameStep(time){
 const th=THEMES[Math.min(li,THEMES.length-1)],step=mStep%16;
 if(step===0){curBar=makeBar(th,mBar);}
 const keys=lvl?lvl.keys:[],frac=keys.length?keys.filter(k=>k.got).length/keys.length:0;
 const lowAir=state==='play'&&air<25;
 const inten=(frac>.6||lowAir?2:frac>.25?1:0);
 const B=curBar,dl=time-AC.currentTime,root=th.root;
 const bassSteps=B.pb===3?[0,3,6,8,10,12,14]:[0,3,6,8,11,14];
 if(bassSteps.includes(step)){const n=root-24+degNote(B.sc,B.deg+(step>=8&&B.pb%2?4:0));tone(hz(n),.16,'triangle',.16,0,dl,musicG);}
 if(step%2===0||inten>=1){const ci=[0,2,4,7,4,2][(step>>(inten?0:1))%6];tone(hz(root+degNote(B.sc,B.deg+ci)),.09,'square',.035,0,dl,musicG);}
 if(step%4===2||(inten>=1&&step%2===0))drum('hat',time);
 if(inten>=1){if(step===0||step===8||(step===10&&B.pb===1))drum('kick',time);if(step===4||step===12)drum('snare',time);
  if(B.pb===3&&step>=13)drum('snare',time);}
 if(inten>=2&&!B.drop){const ln=B.lead[step];if(ln!==null)tone(hz(root+ln),.2,th.lead,.07,0,dl,musicG);}
 if(inten<2&&B.pb===3&&step===0&&B.lead[12]!==null)tone(hz(root+B.lead[12]),.4,th.lead,.04,0,dl,musicG);
 mStep++;if(mStep%16===0)mBar++;
 const th2=lowAir?.82:1;return 60/th.bpm/4*th2;
}
function musicTick(){
 if(!AC)return;
 while(nextNote<AC.currentTime+.3){
  if(state==='title'){const[n,l]=MEL[mTitle];const len=l*.16;
   if(n!==null){const f=440*Math.pow(2,n/12);tone(f,len*.9,'square',.05,0,nextNote-AC.currentTime,musicG);tone(f/4,len*.9,'triangle',.09,0,nextNote-AC.currentTime,musicG);}
   nextNote+=len;mTitle=(mTitle+1)%MEL.length;mStep=0;mBar=0;}
  else nextNote+=gameStep(nextNote);
 }
}
function tone(f,d,type='square',vol=.15,slide=0,delay=0,dest){
 if(!AC)return;const s=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();
 o.type=type;o.frequency.setValueAtTime(f,s);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f+slide),s+d);
 g.gain.setValueAtTime(vol,s);g.gain.exponentialRampToValueAtTime(.001,s+d);
 o.connect(g);g.connect(dest||master);o.start(s);o.stop(s+d+.02);
}
function sfx(n){
 if(!sfxOn||!AC)return;
 if(n==='jump')tone(260,.18,'square',.12,500);
 else if(n==='key'){tone(880,.08,'square',.12);tone(1320,.14,'square',.12,0,.07);}
 else if(n==='die'){tone(500,.7,'sawtooth',.18,-460);tone(120,.7,'square',.12,-90,.05);}
 else if(n==='crumble')tone(90,.12,'sawtooth',.08,-40);
 else if(n==='tick')tone(1200,.03,'square',.05);
 else if(n==='win'){[523,659,784,1047].forEach((f,i)=>tone(f,.2,'square',.13,0,i*.12));}
 else if(n==='open')tone(400,.4,'triangle',.15,800);
}

 const g=ctx.createRadialGradient(px,py,140,px,py,560);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.5)');
 ctx.fillStyle=g;ctx.fillRect(0,0,CW,CAVE_H);
 if(fade>0){ctx.fillStyle=`rgba(0,0,0,${fade})`;ctx.fillRect(0,0,CW,CAVE_H);}
 ctx.restore();
}
function drawHUD(){
 const pal=lvl.pal;
 ctx.fillStyle='#07070d';ctx.fillRect(0,CAVE_H,CW,CH-CAVE_H);
 ctx.fillStyle=pal.accent;ctx.fillRect(0,CAVE_H,CW,36);
 txt(lvl.name.toUpperCase(),CW/2,CAVE_H+19,24,'#10101a','center');
 txt('AIR',24,568,22,'#fff');
 const n=70,on=Math.ceil(Math.max(0,air)/100*n);
 for(let i=0;i<n;i++){const f=i/n;ctx.fillStyle=i<on?(f<.25?'#ff4d4d':f<.5?'#ffb13c':'#4dff88'):'#1c1c2a';ctx.fillRect(90+i*13,556,10,24);}
 const got=lvl.keys.filter(k=>k.got).length;
 txt(`KEYS ${got}/${lvl.keys.length}`,24,612,22,'#ffd23c');
 txt('HIGH '+pad(hi),250,612,22,'#7df9ff');
 txt('SCORE '+pad(score),540,612,22,'#fff');
 if(hardcore)txt('HARDCORE',860,612,22,'#ff4d4d');else for(let i=0;i<Math.max(0,lives);i++){const x=860+i*34;ctx.fillStyle='#ffd23c';ctx.fillRect(x,598,18,6);
  ctx.fillStyle='#ffd1a6';ctx.fillRect(x+2,604,14,9);ctx.fillStyle='#f2f4ff';ctx.fillRect(x+1,613,16,8);}
}
function overlay(title,sub,col,line2){
 ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,0,CW,CAVE_H);
 txt(title,CW/2,200,64,col,'center',col);txt(sub,CW/2,270,26,'#fff','center');if(line2)txt(line2,CW/2,320,20,'#aab','center');
}
function drawTitle(){
 const g=ctx.createLinearGradient(0,0,0,CH);g.addColorStop(0,'#0a0620');g.addColorStop(1,'#2a0a3a');ctx.fillStyle=g;ctx.fillRect(0,0,CW,CH);
 const r=mulberry32(5);for(let i=0;i<80;i++){ctx.fillStyle=`rgba(255,255,255,${.1+r()*.5*(Math.sin(t*.05+i)*.5+.5)})`;ctx.fillRect(r()*CW,r()*CH,2,2);}
 txt('MANIC MINER',CW/2,130,92,'#ffd23c','center','#ff9a3c');
 txt('MODERN REMAKE',CW/2,200,36,'#7df9ff','center','#2de2e6');
 txt('Collect every key, then reach the glowing portal before your air runs out.',CW/2,270,20,'#dde','center');
 const lines=['LEFT / RIGHT or A / D   Move','SPACE / UP / W           Jump','P Pause   M Music   C CRT filter'];
 lines.forEach((s,i)=>txt(s,CW/2,330+i*34,22,'#aab','center'));
 if(Math.floor(t/30)%2){txt(touchMode?'TAP LEFT: NORMAL':'ENTER: NORMAL',CW/2-230,470,28,'#fff','center','#fff');txt(touchMode?'TAP RIGHT: HARDCORE':'H: HARDCORE',CW/2+230,470,28,'#ff4d4d','center','#ff4d4d');}
 txt('3 lives, 5 caverns',CW/2-230,505,16,'#aab','center');txt('1 life, faster foes, 10 caverns',CW/2+230,505,16,'#aab','center');
 txt('HIGH '+pad(hiN),CW/2-230,540,20,'#7df9ff','center');txt('HIGH '+pad(hiH),CW/2+230,540,20,'#ff9a9a','center');
 txt('Fan tribute to the 1983 ZX Spectrum classic by Matthew Smith. All caverns and art are original.',CW/2,590,16,'#778','center');
 const wx=((t*2)%(CW+80))-40;ctx.save();ctx.translate(0,0);drawWilly(wx,545-PH+PH,1,t*.28,false);ctx.restore();
 ctx.fillStyle='#8a4b2a';ctx.fillRect(0,607,CW,6);
}
function render(){
 ctx.clearRect(0,0,CW,CH);
 if(state==='title'){drawTitle();}
 else{
  drawCave();drawHUD();
  if(state==='paused')overlay('PAUSED','Press P to resume','#7df9ff');
  if(state==='gameover')overlay('GAME OVER','Press Enter','#ff4d6d','Final score '+pad(score));
  if(state==='win')overlay('YOU ESCAPED!','All caverns cleared','#ffd23c','Final score '+pad(score)+'   Press Enter');
  if(state==='clear'&&air<=0)txt('CAVERN CLEARED',CW/2,200,56,lvl.pal.accent,'center',lvl.pal.glow);
 }
 if(touchMode&&state!=='title')drawTouch();
 if(crt){ctx.fillStyle='rgba(0,0,0,.1)';for(let y=0;y<CH;y+=3)ctx.fillRect(0,y,CW,1);}
}
let last=performance.now(),acc=0;const DT=1000/60;
function frame(now){acc+=Math.min(100,now-last);last=now;while(acc>=DT){update();acc-=DT;}render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);
</script>
